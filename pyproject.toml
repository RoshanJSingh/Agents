[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-sandbox-agent"
version = "0.1.0"
description = "Docker-isolated LLM-assisted CSV cleaning and baseline model training."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "csv-sandbox-agent contributors" }]
dependencies = [
    "docker>=7.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "pydantic>=1.10.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
csv-sandbox-agent = "csv_sandbox_agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["csv_sandbox_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: tests that require a reachable Docker daemon",
]
